query($owner: String!, $repo: String!, $cursor: String) {
  repository(owner: $owner, name: $repo) {
    issues(first: 50, after: $cursor, states: OPEN, orderBy: {field: UPDATED_AT, direction: DESC}) {
      pageInfo { hasNextPage endCursor }
      nodes {
        number
        title
        url
        createdAt
        updatedAt
        comments { totalCount }
        assignees(first: 5) { nodes { login } }
        labels(first: 10) { nodes { name } }
        author { login }
        timelineItems(last: 20, itemTypes: [CROSS_REFERENCED_EVENT, REFERENCED_EVENT]) {
          nodes {
            __typename
            ... on CrossReferencedEvent {
              createdAt
              source {
                __typename
                ... on PullRequest {
                  number
                  state
                  isDraft
                  merged
                  updatedAt
                  author { login }
                }
              }
            }
            ... on ReferencedEvent {
              createdAt
              commit { oid author { user { login } } }
            }
          }
        }
      }
    }
  }
}
